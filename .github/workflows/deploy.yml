name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# 一次只跑一個部署。進行中的不取消 —— opennext 部署到一半被砍會留下半套 assets。
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # wrangler 要求 Node.js >= 22。釘 20 的話前面 build 全部會過，只有最後
      # 的 deploy 步驟失敗，症狀看起來像部署問題而不是版本問題。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 擋的是「新壞掉的考卷」。已知還沒修好的記在 paper-integrity-baseline.json，
      # 不然這一關從第一天就是紅的 —— 紅久了沒人看，等於沒有這道關卡。
      - name: Check paper integrity
        run: npm run check:papers

      # --forceExit：jest 跑完不會自己退出（--detectOpenHandles 也抓不到來源），
      # 少了這個旗標 CI 會一路卡到 timeout。
      - name: Test
        run: npx jest --ci --forceExit

      # 不帶 --env，對應 wrangler.json 最外層的 name: grad-exam-prep，
      # 也就是 grad-exam-prep.<subdomain>.workers.dev 這個線上站台。
      # account_id 已寫在 wrangler.json，所以只需要 API token 這一個 secret。
      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
